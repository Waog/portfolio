<mat-sidenav-container>
  <mat-sidenav
    position="start"
    mode="side"
    [opened]="customizationStateService.isPanelShown()"
    fixedInViewport="true"
    fixedTopGap="80"
    class="screen-only"
  >
    <div class="header-row">
      <h2 class="heading">Customize</h2>
      <button
        mat-icon-button
        type="button"
        aria-label="Hide panel"
        (click)="hidePanel()"
      >
        <mat-icon>keyboard_double_arrow_left</mat-icon>
      </button>
    </div>

    <div class="controls">
      <mat-checkbox
        [checked]="customizationStateService.isPrintMode()"
        (change)="setPrintMode($event.checked)"
      >
        Print mode
      </mat-checkbox>

      <div class="radio-group-section">
        <span class="radio-group-label">Skill Matrix - Experience Unit</span>
        <mat-radio-group
          [value]="customizationStateService.skillMatrixExperienceUnit()"
          (change)="setSkillMatrixExperienceUnit($event.value)"
        >
          <mat-radio-button value="project-count"
            >project count</mat-radio-button
          >
          <mat-radio-button value="time">time</mat-radio-button>
        </mat-radio-group>
      </div>

      <div class="radio-group-section">
        <span class="radio-group-label">Project Order</span>
        <mat-radio-group
          [value]="customizationStateService.projectSortOrder()"
          (change)="setProjectSortOrder($event.value)"
        >
          <mat-radio-button value="relevance">by relevance</mat-radio-button>
          <mat-radio-button value="date">by date</mat-radio-button>
        </mat-radio-group>
      </div>

      <div class="print-pages-section">
        <span class="radio-group-label">Print Pages - Projects per Page</span>
        @for (pageSize of customizationStateService.printProjectPageSizes();
        track $index) {
        <div class="print-page-row">
          <span class="print-page-label">Page {{ $index + 2 }}</span>
          <mat-form-field
            appearance="outline"
            subscriptSizing="dynamic"
            class="page-size-field"
          >
            <input
              matInput
              type="number"
              min="1"
              [value]="pageSize"
              (change)="setPrintProjectPageSize($index, $event)"
            />
          </mat-form-field>
          <button
            mat-icon-button
            type="button"
            [attr.aria-label]="'Remove page ' + ($index + 2)"
            [disabled]="
              customizationStateService.printProjectPageSizes().length <= 1
            "
            (click)="removePrintProjectPage($index)"
          >
            <mat-icon>remove_circle_outline</mat-icon>
          </button>
        </div>
        }
        <button mat-button type="button" (click)="addPrintProjectPage()">
          <mat-icon>add</mat-icon>
          Add Page
        </button>
      </div>

      <button mat-button type="button" (click)="openReorderDialog()">
        <mat-icon>reorder</mat-icon>
        Customize Project Order
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
